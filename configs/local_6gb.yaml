# ============================================================================
# TriNetra-AMRF — Default Configuration
# ============================================================================
# This file defines default paths, hyperparameters, and runtime settings.
# Override per-experiment by creating a copy or using CLI args.
# ============================================================================

# ── Project Metadata ────────────────────────────────────────────────────────
project:
  name: "TriNetra-AMRF"
  version: "0.1.0"
  description: "Dual-Modality Surveillance Framework"

# ── Dataset Paths ───────────────────────────────────────────────────────────
datasets:
  # Canonical (processed) directories — produced by datasets/split_dataset.py
  visible_dir: "datasets/visible/"
  thermal_dir: "datasets/thermal/"
  annotations_dir: "datasets/annotations/"
  calibration_dir: "datasets/calibration/"

  # Active dataset source (llvip, kaist, m3fd, flir_adas)
  active_source: "m3fd"

  # Per-source raw locations & metadata. Each script reads the block that
  # matches `active_source`.
  sources:
    llvip:
      root: "datasets/LLVIP/"
      visible_subdir: "visible"        # datasets/LLVIP/visible/{train,test}
      thermal_subdir: "infrared"       # datasets/LLVIP/infrared/{train,test}
      annotations_subdir: "Annotations"  # flat VOC XML (both splits)
      annotation_format: "voc"         # voc | kaist | coco
      # LLVIP ships an official train/test split; these are the folder names.
      official_train_dir: "train"
      official_test_dir: "test"
      # LLVIP only labels pedestrians -> map to unified `person` (id 1).
      class_map:
        person: 1
    m3fd:
      root: "datasets/M3FD/"
      visible_subdir: "Vis"             # datasets/M3FD/Vis/*.png (flat, no split)
      thermal_subdir: "Ir"              # datasets/M3FD/Ir/*.png
      annotations_subdir: "Annotation"  # flat VOC XML, same schema as LLVIP
      annotation_format: "voc"          # voc | kaist | coco
      # M3FD ships no official train/test split (unlike LLVIP) -> the whole
      # 4,200 pairs are pooled and split fresh by split_ratios below.
      # M3FD's 6 raw classes -> unified ids. "Lamp" has no COCO equivalent, so it
      # reuses a spare COCO head channel (see detection.class_id_map).
      class_map:
        people: 1
        car: 2
        bus: 3
        truck: 4
        motorcycle: 5
        lamp: 7                      # added later; no COCO class -> see detection.class_id_map

  # Master COCO JSON produced by convert_annotations.py (pre-split).
  master_annotations: "datasets/annotations/instances_all.json"

  # Unified category mapping (shared across all sources).
  categories:
    - {id: 1, name: "person",     supercategory: "human"}
    - {id: 2, name: "car",        supercategory: "vehicle"}
    - {id: 3, name: "bus",        supercategory: "vehicle"}
    - {id: 4, name: "truck",      supercategory: "vehicle"}
    - {id: 5, name: "motorcycle", supercategory: "vehicle"}
    - {id: 6, name: "cyclist",    supercategory: "human"}
    - {id: 7, name: "lamp",       supercategory: "object"}

  # Image properties. M3FD native resolution is 1024x768; the model input
  # size below is what the DataLoader resizes to (width, height). Table 4
  # specifies a square 640x640 input — since M3FD's native aspect (4:3)
  # isn't square, the plain-resize pipeline (datasets/augmentations.py has
  # no letterbox/pad step) will stretch images slightly to fit.
  native_size: [1024, 768]
  image_size: [640, 640]

  # Augmentation settings (consumed by datasets/augmentations.py).
  augmentation:
    horizontal_flip_prob: 0.5
    rotation_limit: 15
    random_resized_crop: true
    crop_scale: [0.6, 1.0]
    color_jitter: true
    thermal_gauss_noise: true
    mosaic: false                      # Enable in later phases

  # Phase 5: the detector is a COCO-pretrained ultralytics YOLOv8 whose frozen
  # backbone was trained on plain 0..1 pixels — NOT ImageNet-standardized ones.
  # Feeding it ImageNet stats shifts the input ~2 sigma off distribution and the
  # frozen backbone produces zero usable detections (measured: 0 person dets on
  # a val batch vs. 3-5 with 0..1 input). Identity stats == a plain /255 scale.
  # The thermal branch matches, because ThermalStem is warm-started by averaging
  # the pretrained 3-channel stem, which expects the same 0..1 range.
  normalize:
    visible_mean: [0.0, 0.0, 0.0]
    visible_std:  [1.0, 1.0, 1.0]
    thermal_mean: [0.0]
    thermal_std:  [1.0]

  # Reproducibility.
  seed: 42

  # train/val/test split ratios. For LLVIP the official test split is
  # preserved as-is; `val` is carved out of the official train split using
  # the train:val proportion below (0.7 : 0.15 -> val = 15/85 of train).
  split_ratios:
    train: 0.7
    val: 0.15
    test: 0.15
  # When a source has an official test split, keep it and only split train/val.
  # M3FD ships no official split (unlike LLVIP) -> pool everything and split fresh.
  respect_official_test: false

# ── Model Weights ──────────────────────────────────────────────────────────
weights:
  save_dir: "weights/"
  detector_checkpoint: null       # Path to detector .pt file
  fusion_checkpoint: null         # set to "weights/fusion/best.pt" once trained
  tracker_checkpoint: null        # Path to tracker .pt file
  risk_model_checkpoint: null     # Path to risk model .pt file

# ── Preprocessing (Phase 3 — Layer 2: Preprocessing & Reliability) ───────────
preprocessing:
  alignment:
    method: "homography"          # Options: homography, affine, rigid
    reference_modality: "visible" # Which modality is the spatial reference
    identity_ok: true             # LLVIP pre-aligned -> skip warp (pass-through)
  denoise:
    method: "bilateral"           # Options: bilateral, nlm, gaussian, guided
    strength: 10                  # bilateral sigmaColor/sigmaSpace; nlm h
    bilateral_d: 5                # neighborhood diameter (mild by default)
    apply_to: ["visible", "thermal"]
  normalize:
    method: "clahe"               # Options: clahe, minmax, zscore, percentile_clip
    clip_limit: 2.0
    tile_grid_size: [8, 8]
    thermal_percentile_clip: [1, 99]  # suppress hot/cold outliers before rescale

  # Thermal Reliability Confidence — the novel Layer-2 output that drives
  # adaptive fusion in Phase 4 (fusion multiplies the thermal branch by trc).
  trc:
    enabled: true
    components:                   # per-cue weights (renormalized over enabled)
      contrast:      0.2          # histogram entropy (flat/saturated -> low)
      gradient:      0.2          # Laplacian variance (blur/defocus -> low)
      saturation:    0.2          # clipped-pixel fraction (sensor clip -> low)
      mutual_info:   0.2          # RGB<->IR MI (thermal crossover -> low)
      align_error:   0.2          # reprojection error (misalignment -> low)
    spatial_map: false            # true -> per-region trc_map for Phase 4
    grid: 8                       # trc_map tiling (grid x grid) when spatial_map
    mode: "online"                # online | offline_cache

# ── Detection ──────────────────────────────────────────────────────────────
detection:
  model: "yolov8m"                # Ultralytics model variant
  input_size: [640, 640]          # match datasets.image_size (W, H)
  confidence_threshold: 0.25
  iou_threshold: 0.45
  num_classes: 7                  # Unified ids (the head stays 80-class COCO)
  # Phase 5 Option A: keep the frozen 80-class COCO head; map unified category
  # ids to COCO class indices. Eval/loss filter to these — any unified id not
  # listed here is dropped from both the loss and the decoded predictions.
  # Standard COCO80 order: person=0, bicycle=1, car=2, motorcycle=3,
  # airplane=4, bus=5, train=6, truck=7. Extended for M3FD (person was the
  # only entry while only LLVIP existed) so car/bus/truck/motorcycle boxes
  # finally get a training signal too.
  class_id_map: {1: 0, 2: 2, 3: 5, 4: 7, 5: 3, 7: 9}   # lamp(7) reuses COCO "traffic light"(9), the nearest pretrained channel

# ── Fusion (Phase 4 — Layer 3: Adaptive Cross-Modal Fusion) ────────────────
fusion:
  strategy: "gated"               # gated | concatenation | attention
  scales: ["P3", "P4", "P5"]      # backbone taps to fuse (strides 8/16/32)
  trc_gate:
    enabled: true                 # multiply thermal branch by trc
    learnable_alpha: true         # wrap gate in a learnable scalar (init 1.0)
    spatial: false                # true -> use Phase 3 trc_map per region
    residual_visible: true        # fused = P_vis + block(trc*P_thr) (safe default)
  backbone:
    base_model: "weights/yolov8m.pt"  # pretrained COCO weights to load
    thermal_warm_start: true      # seed thermal backbone from visible weights
    thermal_stem_init: "mean3ch"  # mean3ch | random
  train_schedule:
    stage1_freeze: ["visible_backbone", "neck", "head"]
    stage1_epochs: 150             # Table 4: 150 epochs
    stage2_unfreeze: ["neck", "head"]   # [] to skip stage 2
    stage2_lr: 1.0e-4

# ── Tracking ───────────────────────────────────────────────────────────────
tracking:
  algorithm: "bytetrack"          # bytetrack (v1, default) | deepsort (legacy baseline) | botsort (v2, planned)
  # -- legacy DeepSORT keys: read only when algorithm == "deepsort" --
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3
  embedder: "mobilenet"          # appearance re-id model; null/none = motion+IoU only (no frame needed)
  # -- ByteTrack + TRC gate (Phase 6 v1) --
  kalman:
    motion_model: "constant_velocity"
  matching:
    high_conf_threshold: 0.6      # stage-1 detections (also the new-track threshold)
    low_conf_threshold: 0.1       # detections below this are discarded entirely
    iou_threshold_stage1: 0.3     # minimum IoU to accept a stage-1 / tentative match
    iou_threshold_stage2: 0.5     # minimum IoU at trc=1 for a low-confidence match
    class_aware: false            # true = never match across detector classes
  trc_gate:
    enabled: true                 # TriNetra-specific; false = stock ByteTrack
    beta: 0.5                     # cost inflation for low-TRC boxes: cost*(1+beta*(1-trc))
  lifecycle:
    n_init: 3                     # matches needed to confirm a tentative track
    max_age: 30                   # frames a lost track is kept before removal
  reid:                           # v1.5: pretrained appearance embedder (no identity-
                                   # labelled data exists for this project, so nothing
                                   # here is trained — see models/tracker/appearance.py)
    enabled: false
    weight: 0.3                   # 0 = IoU only, 1 = appearance only, blended per detection.
                                   # Tuned on the real-clip stress test (utils/stress_eval.py):
                                   # weight=0.5 roughly tripled ID switches vs. plain ByteTrack
                                   # (the pretrained embedder is noisy on this low-res/night/
                                   # aerial footage), but weight 0.2-0.3 cut ID switches by
                                   # ~30% instead. On the synthetic benchmark (clean simulated
                                   # appearance) higher weights also help, so 0.3 is a
                                   # compromise, not a value optimized for either eval alone.
    ema_alpha: 0.9                # smoothing of each track's running appearance embedding
    classes: [1]                  # unified class ids the (person-)embedder is trusted for;
                                   # every other class stays IoU-only (see byte_tracker.py)
    reacquire_gap: 10             # frames a track must be LOST before stage 1.5 (appearance-
                                   # only re-acquisition, no IoU) becomes eligible for it
    weight_ambiguous: 0.9         # appearance weight used when a track has a close IoU
                                   # competitor this frame (see `ambiguity_margin`)
    ambiguity_margin: 0.0         # OFF by default. This targets root cause B (two nearby,
                                   # continuously-tracked objects swapping identity, ~54% of
                                   # all switches, see byte_tracker.py docstring) and on the
                                   # synthetic benchmark it does help a little (crowding-type
                                   # switches 155->151 over 15 seeds at margin=0.3) — but on the
                                   # real-clip stress test it makes IDSW WORSE at every setting
                                   # tried (4.17->5.0-7.3), because the pretrained embedder is
                                   # least reliable in exactly the close-proximity situations
                                   # this leans on it harder for. Root cause B is NOT solved;
                                   # this mechanism is kept available (set e.g. 0.3) for future
                                   # work with a better-trained embedder, not enabled now.
    reacquire_thresh: 0.2         # cosine-distance ceiling for stage 1.5. Same story as `weight`
                                   # above: the synthetic benchmark's clean simulated appearance
                                   # wants this much looser (0.5 minimizes synthetic IDSW: 13.7->3.7,
                                   # a 73% cut), but on the real-clip stress test (noisier pretrained
                                   # embedder) 0.5 causes false reacquisitions and makes IDSW *worse*
                                   # than not having this stage at all. 0.2 is the value that helps
                                   # on both: synthetic IDSW 13.7->9.2 (33% cut, smaller than 0.5's
                                   # but still real) and real-clip IDSW 6.17->3.83 (38% cut, on top
                                   # of the gain from `weight` alone). Not optimal for either eval,
                                   # safe for both.
    embedding_dim: 128             # planned dual-modal (RGB+thermal) embedder, not yet trained
    weights: "weights/tracker/dual_modal_reid.pt"
  heading:                         # second attempt at root cause B (see byte_tracker.py docstring),
                                   # independent of appearance/the embedder: penalizes a candidate
                                   # detection that implies an implausible sudden direction change
                                   # vs. the track's recent motion. Works for every class (not just
                                   # person), unlike reid.*.
                                   #
                                   # OFF by default — tried, debugged, and still not a net win. Two
                                   # real bugs were found and fixed (an unavailable heading was
                                   # still dragging good matches toward a neutral cost; a heading
                                   # estimated across a gap from a missed detection was trusted the
                                   # same as a clean one) but even after both fixes the best setting
                                   # measured on the synthetic benchmark (weight=0.3, margin=0.2) is
                                   # a wash (261 vs 262 crowding-type switches over 15 seeds — not a
                                   # real improvement), and it gets worse at any more assertive
                                   # setting (352 at weight=0.8). Root cause, precisely diagnosed:
                                   # heading-estimate reliability and IoU-match quality degrade from
                                   # the SAME underlying cause (a missed detection / occlusion /
                                   # low TRC), so an already-fragile match is exactly when heading is
                                   # also least trustworthy — it tends to push weak-but-correct
                                   # matches over the rejection threshold rather than rescue
                                   # genuinely healthy-but-ambiguous crowding cases. Root cause B is
                                   # NOT solved by this; a real fix needs a better underlying signal
                                   # (denser motion estimation, e.g. optical flow, or a trained
                                   # embedder), not a cleverer combination of these two.
    enabled: false
    weight: 0.5                   # max contribution when a track has a close IoU competitor
    margin: 0.0                   # same ambiguity-gating idea as reid.ambiguity_margin; 0 = off
    min_hist: 3                   # matched observations required before a track's heading is trusted
    window: 5                     # frames spanned by the heading estimate
    min_disp_frac: 0.05           # min net displacement over `window`, as a fraction of box height,
                                   # before a heading is trusted (excludes loitering/near-stationary)
  behaviour:
    enabled: true
    history_len: 300              # matched observations kept per track
    speed_window: 5               # observations spanned when measuring speed
    smooth_window: 5              # moving-average width for the trajectory
    loiter_speed_thresh: 0.01     # box-heights/frame below which an object counts as still
    move_speed_thresh: 0.02       # box-heights/frame above which a sample is real movement (walking ~0.03)
    loitering_frame_threshold: 150
    path_efficiency_threshold: 0.4
    reversal_window: 20           # trailing velocity samples inspected for reversals
    reversal_count_threshold: 2   # back-forth-back inside the window = pacing (a single U-turn is normal)
    min_obs: 50                   # observations required before path-shape flags
    zone_dwell_threshold: 25      # frames inside a restricted zone before flagging
    low_trc_threshold: 0.5        # mean track TRC below this -> "low_trc_track"
    flag_classes: [1, 5]          # unified ids that receive behaviour flags (person, motorcycle)
    restricted_zones: []          # per-camera polygons in original-frame pixels: [[[x,y],...], ...]

# ── Risk Assessment ───────────────────────────────────────────────────────
risk_model:
  num_threat_levels: 5            # 1 (benign) → 5 (critical)
  temporal_window: 30             # Frames of history for behaviour analysis

# ── Training ───────────────────────────────────────────────────────────────
# LOCAL VARIANT of configs/default.yaml (which targets Colab's 16GB T4) — for
# running on this machine's 6GB RTX 3060 laptop GPU. Everything matches
# Table 4 (reference "Experimental Setting") EXCEPT mixed_precision, which
# is kept ON here: 640x640 + batch 16 + AMP-off (fp32) does not reliably fit
# in 6GB (AMP roughly halves activation memory), where it does comfortably
# in Colab's 16GB. This is a disclosed, hardware-necessitated deviation, not
# a silent one — report it as such alongside the mosaic-not-implemented note
# if these numbers go in the paper. Mosaic itself is still not implemented
# (see configs/default.yaml's comment) — HSV-equivalent jitter (color_jitter,
# below) and horizontal flip are enabled instead.
training:
  batch_size: 8                   # micro-batch; x grad_accum_steps = effective 16 (Table 4). Fits the ~5.1 GB of VRAM usable on this boot
  grad_accum_steps: 2
  num_workers: 0                  # 8 in Table 4; 0 = no worker processes (they crash on this machine under memory pressure)
  epochs: 150
  learning_rate: 0.01
  optimizer: "sgd"
  momentum: 0.937
  lrf: 0.01                       # cosine floor = learning_rate * lrf (ultralytics convention)
  weight_decay: 0.0005
  grad_clip_norm: 10.0
  loss_gains: {box: 7.5, cls: 0.5, dfl: 1.5}   # ultralytics v8DetectionLoss defaults
  warmup_epochs: 3                # linear LR warmup (Stage 2)
  scheduler: "cosine"
  early_stopping_patience: 15
  mixed_precision: true            # LOCAL DEVIATION from Table 4 (AMP off) — see note above
  log_dir: "runs/"
  checkpoint_dir: "weights/fusion/"

# ── Inference ──────────────────────────────────────────────────────────────
inference:
  device: "cuda:0"                # GPU device; falls back to CPU if unavailable
  batch_size: 1
  use_onnx: false
  use_tensorrt: false

# ── API Server ─────────────────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8000
  reload: true
